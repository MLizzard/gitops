apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-demo
  namespace: flux-system
spec:
  interval: 5m
  releaseName: podinfo-demo
  targetNamespace: gitops-helm-demo
  chart:
    spec:
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: podinfo
      interval: 5m
  values:
    replicaCount: 2
